<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mestolo</title>
<script src="config.js"></script>
<style>
  :root { color-scheme: light dark; --bg:#f3f6f2; --ink:#2a1a2e; --muted:#66566b; --saffron:#f5b60a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1320; --ink:#f3edf4; --muted:#bcb0c0; } }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { min-height:100%; box-sizing:border-box; display:flex; flex-direction:column; justify-content:center; gap:16px; padding:max(24px, env(safe-area-inset-top)) 24px 24px; max-width:32rem; margin:0 auto; }
  h1 { font-size:2rem; line-height:1.05; margin:0; letter-spacing:-0.02em; }
  p { margin:0; color:var(--muted); font-size:1.05rem; line-height:1.5; }
  button { align-self:flex-start; min-height:48px; padding:0 24px; border:0; border-radius:999px; background:var(--saffron); color:#2a1a2e; font-weight:700; font-size:1rem; }
  button:focus-visible { outline:3px solid #2e6a4f; outline-offset:2px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#2a1a2e"/><path d="M38 10c-3 0-5 2-5 5v16c0 2-1 3-3 3h-1c-6 0-11 5-11 11s5 11 11 11 11-5 11-11V15c0-3-1-5-2-5z" fill="#f5b60a"/><circle cx="29" cy="45" r="5" fill="#2a1a2e"/></svg>
  <h1 id="t"></h1>
  <p id="l"></p>
  <button id="b" type="button"></button>
</main>
<script>
  var M = {
    it: ['Nessuna connessione', 'Mestolo non riesce a raggiungere il server. Controlla la connessione e riprova.', 'Riprova'],
    en: ['No connection', 'Mestolo cannot reach the server. Check your connection and try again.', 'Try again'],
    es: ['Sin conexión', 'Mestolo no puede conectar con el servidor. Revisa la conexión y vuelve a intentarlo.', 'Reintentar'],
    fr: ['Pas de connexion', 'Mestolo ne parvient pas à joindre le serveur. Vérifiez votre connexion et réessayez.', 'Réessayer'],
    de: ['Keine Verbindung', 'Mestolo erreicht den Server nicht. Prüfe deine Verbindung und versuche es erneut.', 'Erneut versuchen'],
    pt: ['Sem ligação', 'O Mestolo não consegue contactar o servidor. Verifique a ligação e tente novamente.', 'Tentar novamente']
  };
  var lang = (navigator.language || 'it').slice(0, 2);
  var m = M[lang] || M.it;
  document.documentElement.lang = M[lang] ? lang : 'it';
  document.getElementById('t').textContent = m[0];
  document.getElementById('l').textContent = m[1];
  var b = document.getElementById('b');
  b.textContent = m[2];
  b.onclick = function () { location.href = window.MESTOLO_SERVER || '/'; };
</script>
</body>
</html>
