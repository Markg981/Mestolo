version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TS 7 (compilatore nativo) non e' ancora supportato da typescript-eslint
      # (via eslint-config-next): il lint fallisce. Aggiornare a mano quando lo sara'.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Gradle >= 9.6 ha rimosso l'API interna InternalProblems usata da AGP 8.x:
      # la build Android fallisce. Aggiornare il wrapper insieme ad AGP 9.
      - dependency-name: gradle-wrapper
        versions:
          - ">=9.6.0"
    groups:
      gradle-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: swift
    directory: /ios/App/CapApp-SPM
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      swift-minor-patch:
        update-types:
          - minor
          - patch
