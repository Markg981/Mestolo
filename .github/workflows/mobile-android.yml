name: Mobile Android

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Traccia Play per l'upload (alpha = test chiuso). Usato solo se PLAY_SERVICE_ACCOUNT_JSON e' impostato."
        required: false
        default: alpha
        type: string
      build_number:
        description: "Build number (versionCode). Vuoto = run number di GitHub."
        required: false
        type: string
  push:
    tags:
      - "v*"
  # Build debug (senza secrets ne' firma) a ogni modifica dei file mobile, cosi' la pipeline e' sempre provata.
  pull_request:
    paths:
      - "android/**"
      - "mobile/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/mobile-*.mjs"
      - ".github/workflows/mobile-android.yml"

permissions:
  contents: read

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  debug-build:
    name: Build APK debug (senza firma)
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Solo compilazione: serve un URL valido per mobile:sync, non viene pubblicato nulla.
      CAP_SERVER_URL: ${{ vars.CAP_SERVER_URL || 'https://mestolo.vercel.app' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run mobile:sync
      - name: Gradle assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mestolo-apk-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  ci-gate:
    name: Verifica CI del commit (solo tag)
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      checks: read
    steps:
      # Il tag fa partire anche il workflow CI sullo stesso commit: la release aspetta che passino i job bloccanti di ci.yml
      # (lint/test/build, Test DB e backup round trip); il job legal e' non bloccante e resta escluso.
      - name: Attendi il check CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 90); do
            res=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?filter=latest&per_page=100" --jq '["Lint, typecheck, test, build","Test DB (Postgres)","Backup round trip (Postgres)"] as $req | [.check_runs[] | select(.name as $n | $req | index($n))] as $r | if ($r | map(.name) | unique | length) < ($req | length) then (if any($r[]; .status == "completed" and .conclusion != "success") then "failure" else "pending" end) elif any($r[]; .status == "completed" and .conclusion != "success") then "failure" elif all($r[]; .status == "completed") then "success" else "pending" end')
            echo "CI: $res"
            case "$res" in
              success) exit 0 ;;
              failure) echo "::error::CI fallita sul commit ${{ github.sha }}: release bloccata."; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::Timeout in attesa della CI: release bloccata."
          exit 1

  bundle:
    name: Build AAB firmato
    needs: ci-gate
    # Gira anche da workflow_dispatch (gate saltato), ma mai se il gate dei tag fallisce.
    if: ${{ github.event_name != 'pull_request' && !cancelled() && (needs.ci-gate.result == 'success' || needs.ci-gate.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Variabile di repository (Settings -> Variables): URL HTTPS del sito pubblicato.
      CAP_SERVER_URL: ${{ vars.CAP_SERVER_URL }}
      MOBILE_STORE_BUILD: "1"
      MOBILE_BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      # Rifiuta URL segnaposto o non HTTPS (MOBILE_STORE_BUILD=1) e scrive versione/build nei progetti nativi.
      - run: npm run mobile:sync

      - name: Decodifica la keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          elif [ "$IS_RELEASE" = "true" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 non impostato: una release da tag deve essere firmata."
            exit 1
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 non impostato: l'AAB sara' NON firmato."
          fi

      - name: Gradle bundleRelease
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mestolo-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  play-upload:
    name: Upload su Google Play (opzionale)
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Salta se manca il service account
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON == '' }}
        run: |
          echo "PLAY_SERVICE_ACCOUNT_JSON non impostato: upload su Play saltato."
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        with:
          name: mestolo-aab
          path: aab
      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.markg981.mestolo
          releaseFiles: aab/*.aab
          track: ${{ inputs.track || 'alpha' }}
          status: draft
