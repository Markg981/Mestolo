name: Alert on failure

# Workflow riusabile: apre (o aggiorna) una issue "[Alert] <workflow> fallito" quando un workflow schedulato
# fallisce, cosi' il problema non resta nascosto nella tab Actions. Una sola issue aperta per workflow: se esiste
# gia' viene aggiunto un commento; la issue va chiusa a mano dopo la risoluzione.
# Uso: job con `needs: [...]`, `if: failure() && github.event_name == 'schedule'`,
# `permissions: { issues: write }` e `uses: ./.github/workflows/alert-on-failure.yml`.
on:
  workflow_call:

permissions:
  issues: write

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open or update the alert issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="[Alert] ${WORKFLOW} fallito"
          body="Il workflow schedulato **${WORKFLOW}** e' fallito: ${RUN_URL}"$'\n\n'"Controllare i log (spesso mancano secret del repository). Chiudere la issue dopo la risoluzione."
          gh label create ops-alert --color B60205 --description "Workflow schedulato fallito" 2>/dev/null || true
          number="$(gh issue list --state open --label ops-alert --json number,title \
            --jq "map(select(.title == \"${title}\"))[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Ancora fallito: ${RUN_URL}"
          else
            gh issue create --title "$title" --label ops-alert --body "$body"
          fi
