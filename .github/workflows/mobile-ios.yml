name: Mobile iOS (TestFlight)

# Build firmata dell'app iOS su runner macOS e upload su App Store Connect (TestFlight).
# Guida completa: docs/mobile.md, sezione "4. App Store (iOS)".

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Carica la build su App Store Connect (TestFlight)
        type: boolean
        default: true
  push:
    tags:
      - "v*"
  # Compilazione per simulatore senza firma ne' secrets a ogni modifica dei file mobile.
  pull_request:
    paths:
      - "ios/**"
      - "mobile/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/mobile-*.mjs"
      - ".github/workflows/mobile-ios.yml"

concurrency:
  group: mobile-ios-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  simulator-build:
    name: Build simulatore (senza firma)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CAP_SERVER_URL: ${{ vars.CAP_SERVER_URL || 'https://mestolo.vercel.app' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-mobile-config.mjs
      - run: npm run mobile:sync
      - name: Build per simulatore
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 60

  ci-gate:
    name: Verifica CI del commit (solo tag)
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      checks: read
    steps:
      # Il tag fa partire anche il workflow CI sullo stesso commit: la release aspetta che passino i job bloccanti di ci.yml
      # (lint/test/build, Test DB e backup round trip); il job legal e' non bloccante e resta escluso.
      - name: Attendi il check CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 90); do
            res=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?filter=latest&per_page=100" --jq '["Lint, typecheck, test, build","Test DB (Postgres)","Backup round trip (Postgres)"] as $req | [.check_runs[] | select(.name as $n | $req | index($n))] as $r | if ($r | map(.name) | unique | length) < ($req | length) then (if any($r[]; .status == "completed" and .conclusion != "success") then "failure" else "pending" end) elif any($r[]; .status == "completed" and .conclusion != "success") then "failure" elif all($r[]; .status == "completed") then "success" else "pending" end')
            echo "CI: $res"
            case "$res" in
              success) exit 0 ;;
              failure) echo "::error::CI fallita sul commit ${{ github.sha }}: release bloccata."; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::Timeout in attesa della CI: release bloccata."
          exit 1

  ios:
    name: Archive e TestFlight
    needs: ci-gate
    if: ${{ github.event_name != 'pull_request' && !cancelled() && (needs.ci-gate.result == 'success' || needs.ci-gate.result == 'skipped') }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CAP_SERVER_URL: ${{ vars.CAP_SERVER_URL }}
      CAP_APP_ID: ${{ vars.CAP_APP_ID }}
      MOBILE_STORE_BUILD: "1"
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      # Il numero di build deve crescere a ogni upload: usiamo il numero di run del workflow.
      MOBILE_BUILD_NUMBER: ${{ github.run_number }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
    steps:
      - name: Verifica configurazione
        id: preflight
        run: |
          # Config di build (obbligatoria): senza di essa non ha senso nemmeno compilare.
          missing=""
          [ -z "$CAP_SERVER_URL" ] && missing="$missing var:CAP_SERVER_URL"
          if [ -n "$missing" ]; then
            echo "::error::Configurazione mancante (Settings > Secrets and variables > Actions):$missing. Vedi docs/mobile.md, sezione 4."
            exit 1
          fi
          case "$CAP_SERVER_URL" in
            https://*) ;;
            *) echo "::error::CAP_SERVER_URL deve essere un indirizzo https:// per le build da store."; exit 1 ;;
          esac
          # Firma e upload (facoltativi): se manca qualcosa si compila un archivio NON firmato e si salta il resto.
          # Diversamente da Android, su tag l'assenza dei secret Apple non e' un errore: l'account Apple Developer
          # puo' non essere ancora attivo e il tag non deve rompere il workflow. Resta un warning ben visibile.
          nosign=""
          [ -z "$APPLE_TEAM_ID" ] && nosign="$nosign var:APPLE_TEAM_ID"
          [ -z "$ASC_KEY_ID" ] && nosign="$nosign secret:APP_STORE_CONNECT_KEY_ID"
          [ -z "$ASC_ISSUER_ID" ] && nosign="$nosign secret:APP_STORE_CONNECT_ISSUER_ID"
          [ -z "$ASC_PRIVATE_KEY" ] && nosign="$nosign secret:APP_STORE_CONNECT_PRIVATE_KEY"
          if [ -n "$nosign" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Credenziali Apple mancanti:$nosign. Archivio NON firmato, export e upload su TestFlight saltati. Vedi docs/mobile.md, sezione 4."
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Info.plist senza host di sviluppo
        run: node scripts/check-mobile-config.mjs

      - name: Sincronizza il progetto nativo
        # Genera capacitor.config.json, config.xml e public/ (ignorati da git) e aggiorna WKAppBoundDomains.
        run: npm run mobile:sync

      - name: Seleziona Xcode
        # Apple richiede l'SDK iOS corrente per gli upload su App Store Connect: prendiamo l'Xcode 26 piu' recente
        # presente sull'immagine (se manca, il job fallisce invece di compilare con un SDK non accettato).
        run: |
          xcode_app=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode_app" ]; then
            echo "::error::Nessun Xcode 26 sull'immagine macos-15: aggiorna l'immagine o la selezione in mobile-ios.yml."
            ls -d /Applications/Xcode*
            exit 1
          fi
          sudo xcode-select -s "$xcode_app/Contents/Developer"
          xcodebuild -version

      - name: Prepara la chiave App Store Connect
        if: steps.preflight.outputs.signed == 'true'
        run: |
          # Percorso dove cercano la chiave sia xcodebuild (-authenticationKeyPath) sia altool (AuthKey_<id>.p8).
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          key="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          # Il secret puo' essere il .p8 in chiaro (PEM) oppure codificato base64.
          if printf '%s' "$ASC_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_PRIVATE_KEY" > "$key"
          else
            printf '%s' "$ASC_PRIVATE_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          grep -q "BEGIN PRIVATE KEY" "$key" || { echo "::error::APP_STORE_CONNECT_PRIVATE_KEY non e' un file .p8 valido."; exit 1; }
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Archive
        # Firma automatica con la chiave API: -allowProvisioningUpdates crea/aggiorna da solo certificato e profili per
        # entrambi i bundle id (app e ShareExtension, con App Group) senza Mac ne' certificati nel repository.
        # CURRENT_PROJECT_VERSION da riga di comando vale per tutti i target e non dipende dagli script di versione.
        # Senza credenziali Apple (signed=false) l'archivio viene prodotto con CODE_SIGNING_ALLOWED=NO.
        run: |
          set -o pipefail
          if [ "${{ steps.preflight.outputs.signed }}" = "true" ]; then
            sign_args=(
              -allowProvisioningUpdates
              -authenticationKeyPath "$ASC_KEY_PATH"
              -authenticationKeyID "$ASC_KEY_ID"
              -authenticationKeyIssuerID "$ASC_ISSUER_ID"
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
              CODE_SIGN_STYLE=Automatic
            )
          else
            sign_args=(CODE_SIGNING_ALLOWED=NO)
          fi
          xcodebuild archive             -project ios/App/App.xcodeproj             -scheme App             -configuration Release             -destination 'generic/platform=iOS'             -archivePath "$RUNNER_TEMP/Mestolo.xcarchive"             "${sign_args[@]}"             CURRENT_PROJECT_VERSION="$MOBILE_BUILD_NUMBER"             | tee "$RUNNER_TEMP/archive.log" | tail -n 60

      - name: Archivio non firmato come artifact
        if: steps.preflight.outputs.signed != 'true'
        run: ditto -c -k --keepParent "$RUNNER_TEMP/Mestolo.xcarchive" "$RUNNER_TEMP/Mestolo-unsigned.xcarchive.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.preflight.outputs.signed != 'true'
        with:
          name: Mestolo-ios-unsigned-${{ github.run_number }}
          path: ${{ runner.temp }}/Mestolo-unsigned.xcarchive.zip
          if-no-files-found: error
          retention-days: 14

      - name: Esporta l'.ipa
        if: steps.preflight.outputs.signed == 'true'
        run: |
          set -o pipefail
          plist="$RUNNER_TEMP/ExportOptions.plist"
          cp ios/App/ExportOptions.plist "$plist"
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" "$plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Mestolo.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -n 40
          ls -l "$RUNNER_TEMP/export"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.preflight.outputs.signed == 'true'
        with:
          name: Mestolo-ios-build-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload su App Store Connect (TestFlight)
        # Scelta: export in locale + upload con "xcrun altool --upload-app" autenticato con la stessa chiave API.
        # Cosi' l'.ipa resta disponibile come artifact. (Alternativa equivalente: destination=upload in
        # ExportOptions.plist, che carica direttamente da xcodebuild ma non lascia l'.ipa.) altool resta supportato
        # per il solo upload (e' stata rimossa la parte di notarizzazione); non servono Fastlane ne' notarytool.
        if: steps.preflight.outputs.signed == 'true' && (github.event_name == 'push' || inputs.upload)
        run: |
          ipa=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
