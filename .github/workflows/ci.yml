name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Valori fittizi: servono solo a far girare la build.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-role-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      APP_ENCRYPTION_KEY: Y2ktZHVtbXkta2V5LWNpLWR1bW15LWtleS1jaS1kdW1teQ==
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Info.plist senza host di sviluppo
        run: node scripts/check-mobile-config.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  db-tests:
    name: Test DB (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mestolo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: mestolo_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mestolo_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Applica stub Supabase e migrazioni
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/supabase-stub.sql
          for f in supabase/migrations/*.sql; do
            echo "Applying $(basename "$f")"
            psql -v ON_ERROR_STOP=1 -q -f "$f" >/dev/null
          done
      - run: npm run test:db

  backup-roundtrip:
    name: Backup round trip (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mestolo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: mestolo_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Applica stub Supabase e migrazioni
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/supabase-stub.sql
          for f in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -q -f "$f" >/dev/null
          done
      # backup-db.sh -> restore-verify-db.sh su un database nuovo: conteggi e schema identici
      - run: scripts/test-backup-roundtrip.sh postgresql://postgres:postgres@localhost:5432/mestolo_test
