name: Backup

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # Solo chiave PUBBLICA: la privata non sta su GitHub (serve solo al restore)
      BACKUP_GPG_PUBLIC_KEY: ${{ secrets.BACKUP_GPG_PUBLIC_KEY }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Il dump NON va mai in un artifact: il repository e' pubblico e gli artifact sono scaricabili da qualunque
      # utente GitHub autenticato. L'unica destinazione e' lo storage S3/R2 privato (obbligatorio su ogni run).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check secrets
        run: |
          set -euo pipefail
          missing=0
          for v in SUPABASE_DB_URL BACKUP_GPG_PUBLIC_KEY BACKUP_S3_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v non impostato: il backup NON e stato eseguito. Configurarlo in Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          exit $missing

      # Guardia: il dump (anche cifrato) non deve mai finire in un artifact di GitHub
      - name: Forbid artifact upload of backups
        run: |
          set -euo pipefail
          if grep -nE 'upload-artifac[t]' .github/workflows/backup.yml; then
            echo "::error::upload di artifact vietato in backup.yml: il repository e' pubblico, i backup vanno solo su S3 privato."
            exit 1
          fi

      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump database
        run: |
          set -euo pipefail
          # Stesso script provato in CI dal job backup-roundtrip (dump, manifest, cifratura)
          stamp="$(PG_BIN=/usr/lib/postgresql/17/bin scripts/backup-db.sh "$SUPABASE_DB_URL" out)"
          ls -l out
          echo "STAMP=$stamp" >> "$GITHUB_ENV"

      - name: Upload to S3
        run: |
          set -euo pipefail
          endpoint=()
          if [ -n "${BACKUP_S3_ENDPOINT}" ]; then endpoint=(--endpoint-url "${BACKUP_S3_ENDPOINT}"); fi
          export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-auto}"
          aws s3 cp "${endpoint[@]}" "out/backup-${STAMP}.tar.gpg" "s3://${BACKUP_S3_BUCKET}/mestolo/db/backup-${STAMP}.tar.gpg"

      # Fallisce se mancano i secret dello storage, salvo opt-out esplicito (variabile BACKUP_SKIP_STORAGE=true)
      - name: Backup storage files
        env:
          BACKUP_SKIP_STORAGE: ${{ vars.BACKUP_SKIP_STORAGE }}
        run: |
          set -euo pipefail
          if [ "${BACKUP_SKIP_STORAGE}" = "true" ]; then
            echo "::warning::BACKUP_SKIP_STORAGE=true: backup delle immagini disattivato esplicitamente."
            exit 0
          fi
          if [ -z "${NEXT_PUBLIC_SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY non impostati: il backup delle immagini NON e stato eseguito. Configurare i secret oppure impostare la variabile BACKUP_SKIP_STORAGE=true per escluderlo."
            exit 1
          fi
          umask 077
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/backup-storage.mjs storage-out
          # Rilettura del backup appena creato contro il manifest (dimensione + sha256 di ogni file)
          node scripts/verify-storage-backup.mjs storage-out
          tar -cf "out/storage-${STAMP}.tar" -C storage-out .
          . scripts/lib/backup-gpg.sh
          backup_encrypt "out/storage-${STAMP}.tar" "out/storage-${STAMP}.tar.gpg"
          rm -f "out/storage-${STAMP}.tar"
          endpoint=()
          if [ -n "${BACKUP_S3_ENDPOINT}" ]; then endpoint=(--endpoint-url "${BACKUP_S3_ENDPOINT}"); fi
          export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-auto}"
          aws s3 cp "${endpoint[@]}" "out/storage-${STAMP}.tar.gpg" "s3://${BACKUP_S3_BUCKET}/mestolo/storage/storage-${STAMP}.tar.gpg"
