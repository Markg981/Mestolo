name: Backup

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check secrets
        run: |
          set -euo pipefail
          missing=0
          for v in SUPABASE_DB_URL BACKUP_PASSPHRASE; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v non impostato: il backup NON e stato eseguito. Configurarlo in Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          exit $missing

      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump database
        run: |
          set -euo pipefail
          # Stesso script provato in CI dal job backup-roundtrip (dump, manifest, cifratura)
          stamp="$(PG_BIN=/usr/lib/postgresql/17/bin scripts/backup-db.sh "$SUPABASE_DB_URL" out)"
          ls -l out
          echo "STAMP=$stamp" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: db-backup-${{ env.STAMP }}
          path: out/backup-*.gpg
          retention-days: 30
          if-no-files-found: error

      - name: Upload to S3 (optional)
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_S3_BUCKET}" ] || [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "::warning::Secret BACKUP_S3_* non impostati: upload S3 saltato (copia solo negli artifact, retention 30 giorni)."
            exit 0
          fi
          endpoint=()
          if [ -n "${BACKUP_S3_ENDPOINT}" ]; then endpoint=(--endpoint-url "${BACKUP_S3_ENDPOINT}"); fi
          export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-auto}"
          aws s3 cp "${endpoint[@]}" "out/backup-${STAMP}.tar.gpg" "s3://${BACKUP_S3_BUCKET}/mestolo/db/backup-${STAMP}.tar.gpg"

      # Fallisce se mancano i secret dello storage, salvo opt-out esplicito (variabile BACKUP_SKIP_STORAGE=true)
      - name: Backup storage files
        env:
          BACKUP_SKIP_STORAGE: ${{ vars.BACKUP_SKIP_STORAGE }}
        run: |
          set -euo pipefail
          if [ "${BACKUP_SKIP_STORAGE}" = "true" ]; then
            echo "::warning::BACKUP_SKIP_STORAGE=true: backup delle immagini disattivato esplicitamente."
            exit 0
          fi
          if [ -z "${NEXT_PUBLIC_SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY non impostati: il backup delle immagini NON e stato eseguito. Configurare i secret oppure impostare la variabile BACKUP_SKIP_STORAGE=true per escluderlo."
            exit 1
          fi
          umask 077
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/backup-storage.mjs storage-out
          # Rilettura del backup appena creato contro il manifest (dimensione + sha256 di ogni file)
          node scripts/verify-storage-backup.mjs storage-out
          tar -cf "out/storage-${STAMP}.tar" -C storage-out .
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase-fd 3 --output "out/storage-${STAMP}.tar.gpg" "out/storage-${STAMP}.tar" 3<<<"$BACKUP_PASSPHRASE"
          rm -f "out/storage-${STAMP}.tar"
          if [ -n "${BACKUP_S3_BUCKET}" ] && [ -n "${AWS_ACCESS_KEY_ID}" ]; then
            endpoint=()
            if [ -n "${BACKUP_S3_ENDPOINT}" ]; then endpoint=(--endpoint-url "${BACKUP_S3_ENDPOINT}"); fi
            export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-auto}"
            aws s3 cp "${endpoint[@]}" "out/storage-${STAMP}.tar.gpg" "s3://${BACKUP_S3_BUCKET}/mestolo/storage/storage-${STAMP}.tar.gpg"
          fi

      - name: Upload storage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storage-backup-${{ env.STAMP }}
          path: out/storage-*.gpg
          retention-days: 30
          if-no-files-found: ${{ vars.BACKUP_SKIP_STORAGE == 'true' && 'ignore' || 'error' }}
