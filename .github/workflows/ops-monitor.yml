name: Ops monitor

# Controlli periodici che falliscono (e quindi notificano via email di GitHub) quando un job schedulato
# smette di funzionare in silenzio:
# - backup-age: l'ultimo backup su S3 (mestolo/db/) deve avere meno di 36 ore (backup.yml gira ogni notte)
# - missed-reminders: nessun promemoria dei pasti scaduto nelle ultime 24 ore deve essere rimasto senza claim
#   (vuol dire che /api/cron/meal-reminders non e' stata chiamata nella sua finestra)
# - recent-success: Backup, Restore verify e Meal reminders devono avere almeno un'esecuzione riuscita nelle ultime 48 ore
#   (Restore verify e' settimanale: soglia 8 giorni); un workflow mai eseguito o sempre fallito (es. secret mancanti) fa fallire il check
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  actions: read

jobs:
  backup-age:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MAX_AGE_HOURS: 36
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
    steps:
      - name: Check age of the latest backup
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_S3_BUCKET}" ] || [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "::error::Secret BACKUP_S3_* non impostati: impossibile controllare l'eta' del backup."
            exit 1
          fi
          endpoint=()
          if [ -n "${BACKUP_S3_ENDPOINT}" ]; then endpoint=(--endpoint-url "${BACKUP_S3_ENDPOINT}"); fi
          export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-auto}"
          latest="$(aws s3api list-objects-v2 "${endpoint[@]}" --bucket "${BACKUP_S3_BUCKET}" --prefix mestolo/db/             --query 'sort_by(Contents, &LastModified)[-1].LastModified' --output text 2>/dev/null || true)"
          if [ -z "$latest" ] || [ "$latest" = "None" ]; then
            echo "::error::Nessun backup in S3 (mestolo/db/): non esiste alcun backup del database."
            exit 1
          fi
          age_h=$(( ( $(date -u +%s) - $(date -u -d "$latest" +%s) ) / 3600 ))
          echo "Ultimo backup: $latest (${age_h}h fa)"
          if [ "$age_h" -ge "$MAX_AGE_HOURS" ]; then
            echo "::error::L'ultimo backup riuscito ha ${age_h} ore (soglia ${MAX_AGE_HOURS}): controllare il workflow Backup."
            exit 1
          fi

  missed-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check reminders that were never claimed
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "::error::Secret SUPABASE_DB_URL non impostato: impossibile controllare i promemoria."
            exit 1
          fi
          # Stessa selezione di claim_due_meal_reminders(), ma su 24 ore (con un'ora di margine) e contando solo i pasti
          # pianificati, attivati e con sottoscrizione PRIMA dell'orario del promemoria: se uno non ha nemmeno una riga
          # in meal_reminders_sent, lo scheduler non ha chiamato la route in tempo.
          out="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -F ' ' <<'SQL'
          with due as (
            select e.id, ((e.plan_date + st.t) at time zone np.timezone) as due_at, e.created_at, np.updated_at, np.user_id
            from public.notification_preferences np
            join public.meal_plan_entries e on e.owner_id = np.user_id
            cross join lateral (
              select case e.slot
                when 'breakfast' then np.breakfast_time
                when 'lunch' then np.lunch_time
                when 'dinner' then np.dinner_time
                when 'snack' then np.snack_time
              end as t
            ) st
            where np.enabled and st.t is not null
          )
          select
            (select count(*) from due d
              where d.due_at between now() - interval '24 hours' and now() - interval '1 hour'
                and d.created_at < d.due_at and d.updated_at < d.due_at
                and exists (select 1 from public.push_subscriptions s where s.user_id = d.user_id and s.created_at < d.due_at)
                and not exists (select 1 from public.meal_reminders_sent x where x.entry_id = d.id)),
            coalesce((select max(sent_at)::text from public.meal_reminders_sent), 'mai');
          SQL
          )"
          read -r missed last_sent <<<"$out"
          echo "Promemoria mancati nelle ultime 24h: $missed (ultimo invio: $last_sent)"
          if [ "$missed" -gt 0 ]; then
            echo "::error::$missed promemoria dei pasti non sono mai stati elaborati: lo scheduler di /api/cron/meal-reminders non sta girando abbastanza spesso (vedi workflow Meal reminders / vercel.pro.json)."
            exit 1
          fi

  recent-success:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      # true = i promemoria sono chiamati da uno scheduler esterno: meal-reminders.yml salta il job
      # (run "skipped", mai "success"), quindi il suo ultimo successo non va controllato qui.
      # Il controllo missed-reminders resta attivo: legge il DB e vale per qualsiasi scheduler.
      MEAL_EXTERNAL: ${{ vars.MEAL_REMINDERS_EXTERNAL_SCHEDULER }}
    steps:
      - name: Check recent successful runs of critical workflows
        run: |
          set -euo pipefail
          fail=0
          # nome del workflow:ore massime dall'ultimo successo
          for spec in "Backup:48" "Meal reminders:48" "Restore verify:192"; do
            wf="${spec%:*}"; max_h="${spec##*:}"
            if [ "$wf" = "Meal reminders" ] && [ "$MEAL_EXTERNAL" = "true" ]; then
              echo "Workflow '$wf': scheduler esterno attivo (MEAL_REMINDERS_EXTERNAL_SCHEDULER=true), controllo saltato; vale il job missed-reminders."
              continue
            fi
            last="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --status success --limit 1               --json updatedAt --jq '.[0].updatedAt // empty')"
            if [ -z "$last" ]; then
              echo "::error::Workflow '$wf': nessuna esecuzione riuscita (secret mancanti o workflow mai eseguito)."
              fail=1
              continue
            fi
            age_h=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 3600 ))
            echo "Workflow '$wf': ultimo successo $last (${age_h}h fa, soglia ${max_h}h)"
            if [ "$age_h" -ge "$max_h" ]; then
              echo "::error::Workflow '$wf': ultimo successo ${age_h} ore fa (soglia ${max_h})."
              fail=1
            fi
          done
          exit $fail

  heartbeat:
    needs: [backup-age, missed-reminders, recent-success]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Heartbeat esterno (opzionale)
        if: success()
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL_OPS_MONITOR }}
        run: |
          # Fail-open: senza secret o con il servizio irraggiungibile il job NON fallisce
          if [ -z "$HEARTBEAT_URL" ]; then
            echo "HEARTBEAT_URL_OPS_MONITOR non impostato: heartbeat esterno saltato."
            exit 0
          fi
          curl --silent --show-error --max-time 20 --retry 2 --retry-all-errors -o /dev/null "$HEARTBEAT_URL"       || echo "::warning::Ping di heartbeat non riuscito (ignorato)."

  alert:
    needs: [backup-age, missed-reminders, recent-success]
    if: ${{ failure() && github.event_name == 'schedule' }}
    permissions:
      issues: write
    uses: ./.github/workflows/alert-on-failure.yml
