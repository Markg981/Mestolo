name: E2E

# Su pull_request verso main gli E2E girano contro un Supabase LOCALE avviato nel
# runner (job "e2e-pr"): ambiente isolato per ogni run, nessun secret necessario,
# quindi funziona anche per le PR da fork e per Dependabot. Il job contro lo
# staging condiviso (job "e2e") resta per push su main, cron notturno e avvio
# manuale: lo staging accetta un job alla volta e non va usato dalle PR.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

# Un solo run per PR: un nuovo push annulla il precedente. Per push/cron/manuale
# non si annulla nulla.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright (Supabase staging)
    # Dependabot non riceve i secret per design: il job viene SALTATO invece di
    # fallire per secret mancanti.
    if: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' }}
    # Tutte le esecuzioni condividono lo stesso Supabase di staging e gli stessi
    # utenti di test: due job in parallelo si disturbano (es. il logout globale
    # di uno invalida la sessione dell'altro). Un solo job alla volta; GitHub
    # tiene in coda al massimo un job per gruppo e annulla gli altri in attesa
    # (per questo il workflow non gira sulle pull request).
    concurrency:
      group: e2e-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      APP_ENCRYPTION_KEY: Y2ktZHVtbXkta2V5LWNpLWR1bW15LWtleS1jaS1kdW1teQ==
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Verifica secret di staging
        id: secrets
        run: |
          if [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            # Formato dell'URL verificato senza stamparne il valore.
            if ! printf '%s' "$NEXT_PUBLIC_SUPABASE_URL" | grep -Eq '^https://[a-z0-9]+\.supabase\.co/?$'; then
              echo "::error::STAGING_SUPABASE_URL non valido (lunghezza ${#NEXT_PUBLIC_SUPABASE_URL}): atteso https://<ref>.supabase.co, senza virgolette, spazi o a capo."
              exit 1
            fi
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Secret STAGING_SUPABASE_URL / STAGING_SUPABASE_ANON_KEY / STAGING_SUPABASE_SERVICE_ROLE_KEY mancanti: impossibile eseguire gli E2E. Configurali in Settings > Secrets and variables > Actions (vedi README)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.available == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.secrets.outputs.available == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.secrets.outputs.available == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.secrets.outputs.available == 'true'
      - run: npm run test:e2e
        if: steps.secrets.outputs.available == 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.secrets.outputs.available == 'true' }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  e2e-pr:
    name: Playwright (Supabase locale)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      APP_ENCRYPTION_KEY: Y2ktZHVtbXkta2V5LWNpLWR1bW15LWtleS1jaS1kdW1teQ==
      CRON_SECRET: ci-dummy-cron-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: latest
      # Avvia Postgres/Auth/Storage/Realtime in Docker e applica supabase/migrations.
      - name: Avvia Supabase locale
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor
      - name: Esporta URL e chiavi locali
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          get() { grep -E "^$1=" "$RUNNER_TEMP/supabase.env" | head -1 | cut -d= -f2- | tr -d '"'; }
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(get API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(get ANON_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(get SERVICE_ROLE_KEY)"
          } >> "$GITHUB_ENV"
          for k in ANON_KEY SERVICE_ROLE_KEY; do echo "::add-mask::$(get $k)"; done
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-local
          path: playwright-report/
          retention-days: 14
      - name: Ferma Supabase locale
        if: always()
        run: supabase stop --no-backup
