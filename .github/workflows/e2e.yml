name: E2E

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    # Il nome del job e' il nome del required status check: NON rinominarlo
    # senza aggiornare la branch protection (vedi README).
    name: Playwright (Supabase staging)
    # PR da fork e da Dependabot non ricevono i secret per design: il job viene
    # SALTATO (stato "skipped", non "success") invece di passare senza test.
    # Un maintainer deve rilanciare gli E2E (workflow_dispatch su un branch del repo).
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && github.actor != 'dependabot[bot]' }}
    # Tutte le esecuzioni condividono lo stesso Supabase di staging e gli stessi
    # utenti di test: due job in parallelo si disturbano (es. il logout globale
    # di uno invalida la sessione dell'altro). Un solo job alla volta; GitHub
    # tiene in coda al massimo un job per gruppo e annulla gli altri in attesa.
    concurrency:
      group: e2e-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      APP_ENCRYPTION_KEY: Y2ktZHVtbXkta2V5LWNpLWR1bW15LWtleS1jaS1kdW1teQ==
    steps:
      - name: Verifica secret di staging
        id: secrets
        run: |
          if [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            # Formato dell'URL verificato senza stamparne il valore.
            if ! printf '%s' "$NEXT_PUBLIC_SUPABASE_URL" | grep -Eq '^https://[a-z0-9]+\.supabase\.co/?$'; then
              echo "::error::STAGING_SUPABASE_URL non valido (lunghezza ${#NEXT_PUBLIC_SUPABASE_URL}): atteso https://<ref>.supabase.co, senza virgolette, spazi o a capo."
              exit 1
            fi
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Secret STAGING_SUPABASE_URL / STAGING_SUPABASE_ANON_KEY / STAGING_SUPABASE_SERVICE_ROLE_KEY mancanti: impossibile eseguire gli E2E. Configurali in Settings > Secrets and variables > Actions (vedi README)."
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.secrets.outputs.available == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.secrets.outputs.available == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.secrets.outputs.available == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.secrets.outputs.available == 'true'
      - run: npm run test:e2e
        if: steps.secrets.outputs.available == 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && steps.secrets.outputs.available == 'true' }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
