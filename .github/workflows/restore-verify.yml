name: Restore verify

on:
  schedule:
    - cron: '47 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Chiave PRIVATA (armored, senza passphrase) dedicata alla verifica: i backup stanno solo su S3 privato
      BACKUP_GPG_PRIVATE_KEY: ${{ secrets.BACKUP_GPG_PRIVATE_KEY }}
      TARGET: postgresql://postgres:pw@localhost:5432/postgres
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check secrets
        run: |
          missing=0
          for v in BACKUP_GPG_PRIVATE_KEY BACKUP_S3_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v non impostato: impossibile verificare il restore."
              missing=1
            fi
          done
          exit $missing

      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      # Unica fonte: copia S3 piu' recente (i backup non sono piu' negli artifact GitHub, che nel repository
      # pubblico sarebbero scaricabili da chiunque)
      - name: Download latest backup
        run: |
          set -euo pipefail
          umask 077
          mkdir -p dl
          endpoint=()
          if [ -n "${BACKUP_S3_ENDPOINT}" ]; then endpoint=(--endpoint-url "${BACKUP_S3_ENDPOINT}"); fi
          export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-auto}"
          key="$(aws s3api list-objects-v2 "${endpoint[@]}" --bucket "${BACKUP_S3_BUCKET}" --prefix mestolo/db/             --query 'sort_by(Contents, &LastModified)[-1].Key' --output text 2>/dev/null || true)"
          if [ -z "$key" ] || [ "$key" = "None" ]; then
            echo "::error::Nessun backup trovato su S3 (mestolo/db/)."
            exit 1
          fi
          aws s3 cp "${endpoint[@]}" "s3://${BACKUP_S3_BUCKET}/${key}" "dl/$(basename "$key")"
          echo "BACKUP_FILE=dl/$(basename "$key")" >> "$GITHUB_ENV"
          echo "Ripristino dalla copia S3: $key"

      # Decifra con la chiave privata, ripristina (stub Supabase, auth -> public -> trigger auth) e confronta col manifest;
      # stesso script provato in CI dal job backup-roundtrip
      - name: Restore and compare with manifest
        run: scripts/restore-verify-db.sh "$BACKUP_FILE" "$TARGET" work

      # Decifra, estrae e riverifica ogni file dello storage contro storage-manifest.json (size + sha256).
      # Backup storage assente su S3 = errore, salvo opt-out esplicito (variabile BACKUP_SKIP_STORAGE=true)
      - name: Download and verify storage backup
        env:
          BACKUP_SKIP_STORAGE: ${{ vars.BACKUP_SKIP_STORAGE }}
          BACKUP_SKIP_STORAGE_REASON: ${{ vars.BACKUP_SKIP_STORAGE_REASON }}
        run: |
          set -euo pipefail
          umask 077
          if [ "${BACKUP_SKIP_STORAGE}" = "true" ]; then
            if [ -z "${BACKUP_SKIP_STORAGE_REASON}" ]; then
              echo "::error::BACKUP_SKIP_STORAGE=true richiede la variabile BACKUP_SKIP_STORAGE_REASON con la motivazione."
              exit 1
            fi
            echo "::error title=Verifica storage disattivata::motivo: ${BACKUP_SKIP_STORAGE_REASON}"
            echo "Verifica del backup storage disattivata: ${BACKUP_SKIP_STORAGE_REASON}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p dl-storage
          endpoint=()
          if [ -n "${BACKUP_S3_ENDPOINT}" ]; then endpoint=(--endpoint-url "${BACKUP_S3_ENDPOINT}"); fi
          export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-auto}"
          key="$(aws s3api list-objects-v2 "${endpoint[@]}" --bucket "${BACKUP_S3_BUCKET}" --prefix mestolo/storage/             --query 'sort_by(Contents, &LastModified)[-1].Key' --output text 2>/dev/null || true)"
          if [ -z "$key" ] || [ "$key" = "None" ]; then
            echo "::error::Nessun backup storage su S3 (mestolo/storage/). Impostare BACKUP_SKIP_STORAGE=true solo se e voluto."
            exit 1
          fi
          aws s3 cp "${endpoint[@]}" "s3://${BACKUP_S3_BUCKET}/${key}" "dl-storage/$(basename "$key")"
          f="dl-storage/$(basename "$key")"
          mkdir -p storage-restore
          . scripts/lib/backup-gpg.sh
          backup_decrypt "$f" storage-restore.tar
          tar -xf storage-restore.tar -C storage-restore
          node scripts/verify-storage-backup.mjs storage-restore

  alert:
    needs: [verify]
    if: ${{ failure() && github.event_name == 'schedule' }}
    permissions:
      issues: write
    uses: ./.github/workflows/alert-on-failure.yml
