name: Restore verify

on:
  schedule:
    - cron: '47 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      GH_TOKEN: ${{ github.token }}
      TARGET: postgresql://postgres:pw@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check secrets
        run: |
          if [ -z "${BACKUP_PASSPHRASE}" ]; then
            echo "::error::BACKUP_PASSPHRASE non impostato: impossibile verificare il restore."
            exit 1
          fi

      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Download latest backup
        run: |
          set -euo pipefail
          umask 077
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow backup.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::Nessun run riuscito di backup.yml: nessun backup da verificare."
            exit 1
          fi
          mkdir -p dl
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --pattern 'db-backup-*' --dir dl
          echo "BACKUP_FILE=$(ls dl/*/backup-*.tar.gpg | head -n1)" >> "$GITHUB_ENV"

      # Decifra, ripristina (stub Supabase, auth -> public -> trigger auth) e confronta col manifest;
      # stesso script provato in CI dal job backup-roundtrip
      - name: Restore and compare with manifest
        run: scripts/restore-verify-db.sh "$BACKUP_FILE" "$TARGET" work
