name: Restore verify

on:
  schedule:
    - cron: '47 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      TARGET: postgresql://postgres:pw@localhost:5432/postgres
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check secrets
        run: |
          if [ -z "${BACKUP_PASSPHRASE}" ]; then
            echo "::error::BACKUP_PASSPHRASE non impostato: impossibile verificare il restore."
            exit 1
          fi

      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      # Fonte primaria: copia S3 piu' recente (e' quella che serve in un vero disaster recovery).
      # Fallback sull'artifact GitHub se S3 non e' configurato o non restituisce nulla.
      - name: Download latest backup
        run: |
          set -euo pipefail
          umask 077
          mkdir -p dl
          if [ -n "${BACKUP_S3_BUCKET}" ] && [ -n "${AWS_ACCESS_KEY_ID}" ] && [ -n "${AWS_SECRET_ACCESS_KEY}" ]; then
            endpoint=()
            if [ -n "${BACKUP_S3_ENDPOINT}" ]; then endpoint=(--endpoint-url "${BACKUP_S3_ENDPOINT}"); fi
            export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-auto}"
            key="$(aws s3api list-objects-v2 "${endpoint[@]}" --bucket "${BACKUP_S3_BUCKET}" --prefix mestolo/db/               --query 'sort_by(Contents, &LastModified)[-1].Key' --output text 2>/dev/null || true)"
            if [ -n "$key" ] && [ "$key" != "None" ]; then
              aws s3 cp "${endpoint[@]}" "s3://${BACKUP_S3_BUCKET}/${key}" "dl/$(basename "$key")"
              echo "BACKUP_FILE=dl/$(basename "$key")" >> "$GITHUB_ENV"
              echo "BACKUP_FROM_S3=true" >> "$GITHUB_ENV"
              echo "Ripristino dalla copia S3: $key"
              exit 0
            fi
            echo "::error::Nessun backup trovato su S3 (mestolo/db/): la copia S3 e' obbligatoria, nessun fallback sull'artifact."
            exit 1
          fi
          echo "::error::Secret BACKUP_S3_* non impostati: impossibile verificare la copia S3."
          exit 1

      # Decifra, ripristina (stub Supabase, auth -> public -> trigger auth) e confronta col manifest;
      # stesso script provato in CI dal job backup-roundtrip
      - name: Restore and compare with manifest
        run: scripts/restore-verify-db.sh "$BACKUP_FILE" "$TARGET" work

      # Decifra, estrae e riverifica ogni file dello storage contro storage-manifest.json (size + sha256).
      # Backup storage assente = errore, salvo opt-out esplicito (variabile BACKUP_SKIP_STORAGE=true)
      - name: Download and verify storage backup
        env:
          BACKUP_SKIP_STORAGE: ${{ vars.BACKUP_SKIP_STORAGE }}
          BACKUP_SKIP_STORAGE_REASON: ${{ vars.BACKUP_SKIP_STORAGE_REASON }}
        run: |
          set -euo pipefail
          umask 077
          if [ "${BACKUP_SKIP_STORAGE}" = "true" ]; then
            if [ -z "${BACKUP_SKIP_STORAGE_REASON}" ]; then
              echo "::error::BACKUP_SKIP_STORAGE=true richiede la variabile BACKUP_SKIP_STORAGE_REASON con la motivazione."
              exit 1
            fi
            echo "::error title=Verifica storage disattivata::motivo: ${BACKUP_SKIP_STORAGE_REASON}"
            echo "Verifica del backup storage disattivata: ${BACKUP_SKIP_STORAGE_REASON}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p dl-storage
          f=""
          if [ "${BACKUP_FROM_S3:-}" = "true" ]; then
            endpoint=()
            if [ -n "${BACKUP_S3_ENDPOINT}" ]; then endpoint=(--endpoint-url "${BACKUP_S3_ENDPOINT}"); fi
            export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-auto}"
            key="$(aws s3api list-objects-v2 "${endpoint[@]}" --bucket "${BACKUP_S3_BUCKET}" --prefix mestolo/storage/               --query 'sort_by(Contents, &LastModified)[-1].Key' --output text 2>/dev/null || true)"
            if [ -n "$key" ] && [ "$key" != "None" ]; then
              aws s3 cp "${endpoint[@]}" "s3://${BACKUP_S3_BUCKET}/${key}" "dl-storage/$(basename "$key")"
              f="dl-storage/$(basename "$key")"
            fi
          fi
          if [ -z "$f" ]; then
            echo "::error::Nessun backup storage su S3 (mestolo/storage/). Impostare BACKUP_SKIP_STORAGE=true solo se e voluto."
            exit 1
          fi
          mkdir -p storage-restore
          gpg --batch --pinentry-mode loopback --passphrase-fd 3 --output storage-restore.tar --decrypt "$f" 3<<<"$BACKUP_PASSPHRASE"
          tar -xf storage-restore.tar -C storage-restore
          node scripts/verify-storage-backup.mjs storage-restore
