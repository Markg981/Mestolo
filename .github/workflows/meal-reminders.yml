name: Meal reminders

# Scheduler esterno per i promemoria Web Push: il piano Vercel Hobby ammette solo un cron giornaliero
# (vercel.json), troppo poco per promemoria puntuali. Chiama la route ogni 15 minuti; i duplicati sono
# esclusi da meal_reminders_sent. Un errore della route (non 2xx) fa fallire il job: GitHub
# invia la notifica di workflow fallito. GitHub puo' ritardare o saltare le esecuzioni pianificate (la finestra di
# recupero e' di 45 minuti) e disattiva gli schedule dopo 60 giorni senza attivita' nel repo: controllare la tab
# Actions e riabilitare il workflow se serve. Senza i secret APP_URL e CRON_SECRET il job fallisce; se la route
# e' chiamata da un altro scheduler (vercel.pro.json o servizio esterno) impostare la variabile
# MEAL_REMINDERS_EXTERNAL_SCHEDULER=true per disattivarlo. ops-monitor.yml segnala comunque i promemoria mai elaborati (controllo sul DB) ma, con la variabile a true, non richiede piu un run riuscito di questo workflow.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: meal-reminders
  cancel-in-progress: false

jobs:
  trigger:
    if: vars.MEAL_REMINDERS_EXTERNAL_SCHEDULER != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call /api/cron/meal-reminders
        run: |
          set -euo pipefail
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL o CRON_SECRET non impostati: i promemoria dei pasti NON vengono inviati. Configurare i secret oppure impostare la variabile MEAL_REMINDERS_EXTERNAL_SCHEDULER=true se la route e' chiamata da un altro scheduler."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 --retry 2 --retry-all-errors \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/meal-reminders"

      - name: Heartbeat esterno (opzionale)
        if: success()
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL_MEAL_REMINDERS }}
        run: |
          # Fail-open: senza secret o con il servizio irraggiungibile il job NON fallisce
          if [ -z "$HEARTBEAT_URL" ]; then
            echo "HEARTBEAT_URL_MEAL_REMINDERS non impostato: heartbeat esterno saltato."
            exit 0
          fi
          curl --silent --show-error --max-time 20 --retry 2 --retry-all-errors -o /dev/null "$HEARTBEAT_URL"       || echo "::warning::Ping di heartbeat non riuscito (ignorato)."

  alert:
    needs: [trigger]
    if: ${{ failure() && github.event_name == 'schedule' }}
    permissions:
      issues: write
    uses: ./.github/workflows/alert-on-failure.yml
